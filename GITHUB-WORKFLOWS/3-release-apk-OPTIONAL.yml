name: Release APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Require signing secrets
        env:
          KS: ${{ secrets.SL_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.SL_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.SL_KEY_ALIAS }}
          KP: ${{ secrets.SL_KEY_PASSWORD }}
        run: |
          for v in KS KSP KA KP; do
            if [ -z "${!v}" ]; then echo "Missing signing secret ($v). Refusing to build an unsigned/debug-signed release."; exit 1; fi
          done
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        env:
          SL_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SL_KEYSTORE_PASSWORD: ${{ secrets.SL_KEYSTORE_PASSWORD }}
          SL_KEY_ALIAS: ${{ secrets.SL_KEY_ALIAS }}
          SL_KEY_PASSWORD: ${{ secrets.SL_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew testReleaseUnitTest assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SL-LAUNCHER-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
