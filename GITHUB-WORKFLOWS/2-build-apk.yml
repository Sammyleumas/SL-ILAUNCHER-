name: SL-LAUNCHER Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check Gradle Wrapper files exist
        run: |
          for f in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            [ -f "$f" ] || { echo "::error::Missing $f. Run the Generate Wrapper workflow once."; exit 1; }
          done

      - name: Locate Gradle project (handles files uploaded inside a subfolder)
        run: |
          echo "Top-level repo contents:"; ls -la
          S="$(find . -maxdepth 3 -name settings.gradle.kts -not -path './.git/*' | head -n1)"
          if [ -z "$S" ]; then
            echo "::error::settings.gradle.kts not found. Upload the project files (app/, build.gradle.kts, settings.gradle.kts, gradle.properties) to the repo."
            echo "Files found (depth 3):"; find . -maxdepth 3 -not -path './.git/*' | sort
            exit 1
          fi
          DIR="$(dirname "$S")"
          for f in build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            [ -f "$DIR/$f" ] || { echo "::error::Missing $DIR/$f. Re-upload it."; exit 1; }
          done
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Gradle project root: $DIR"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare preinstalled Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew
      - name: Build
        run: ./gradlew -p "$PROJECT_DIR" testDebugUnitTest assembleDebug lintDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SL-LAUNCHER-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports
            ${{ env.PROJECT_DIR }}/app/build/test-results
          if-no-files-found: ignore
