name: SL-LAUNCHER Unpack Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the project zip into the repo root
        run: |
          Z="$(ls SL-LAUNCHER-complete.zip 2>/dev/null || ls *.zip 2>/dev/null | head -n1 || true)"
          [ -n "$Z" ] || { echo "::error::No .zip found in the repo root."; exit 1; }
          rm -rf "$RUNNER_TEMP/unz"; mkdir -p "$RUNNER_TEMP/unz"
          unzip -q "$Z" -d "$RUNNER_TEMP/unz"
          S="$(find "$RUNNER_TEMP/unz" -maxdepth 3 -name settings.gradle.kts | head -n1)"
          [ -n "$S" ] || { echo "::error::settings.gradle.kts not found inside $Z"; exit 1; }
          SRC="$(dirname "$S")"
          tar -C "$SRC" --exclude=./.github --exclude=./gradle --exclude=./gradlew --exclude=./gradlew.bat -cf - . | tar -xf -
          git rm -q "$Z"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "Unpack SL-LAUNCHER project"
          git push
