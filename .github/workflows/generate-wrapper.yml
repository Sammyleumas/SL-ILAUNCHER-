name: SL-LAUNCHER Generate Wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Generate wrapper (official Gradle 8.10.2)
        run: |
          mkdir -p "$RUNNER_TEMP/wrapgen"
          cd "$RUNNER_TEMP/wrapgen"
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          cd "$GITHUB_WORKSPACE"
          mkdir -p gradle/wrapper
          cp "$RUNNER_TEMP/wrapgen/gradlew" "$RUNNER_TEMP/wrapgen/gradlew.bat" .
          cp "$RUNNER_TEMP/wrapgen/gradle/wrapper/gradle-wrapper.jar" "$RUNNER_TEMP/wrapgen/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
      - name: Commit wrapper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git update-index --chmod=+x gradlew
          git diff --cached --quiet && echo "Wrapper already up to date" || git commit -m "Add Gradle Wrapper 8.10.2"
          git push
